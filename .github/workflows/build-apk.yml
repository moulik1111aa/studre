# Builds the signed Study Hard APK on every push to main and publishes it as a GitHub
# Release. An Android 15 emulator smoke test can be run on demand (see the smoke job).
# The newest APK is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/StudyHard.apk
#
# Signing: native/android/studyhard-release.jks.gpg is the release keystore,
# encrypted with the STUDYHARD_SIGNING_PASSWORD repository secret (which is also
# the keystore password). Every update must be signed with this same key, or
# Android refuses to install it over the previous version.
#
# Results for whoever is working on the app (screenshots, logcat, build logs)
# are pushed to the `ci-results` branch, since workflow artifacts and logs are
# not always reachable from where the code is written.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      smoke:
        description: Also run the emulator smoke test (slow)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

env:
  # SHA-256 of the release certificate; a build signed with anything else is not published.
  CERT_SHA256: 7f76134862b98c477190933dac0db81e8d6a16efbba3defed69b3d57893b526f
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check the signing secret
        env:
          PW: ${{ secrets.STUDYHARD_SIGNING_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error::The STUDYHARD_SIGNING_PASSWORD secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee -a ci.log

      - name: Type-check and unit tests
        run: |
          set -o pipefail
          { npm run typecheck && npm test; } 2>&1 | tee -a ci.log

      - name: Build the app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a ci.log

      - name: Generate the Android project
        run: |
          set -o pipefail
          node scripts/android.mjs 2>&1 | tee -a ci.log

      - name: Unlock the signing key
        env:
          PW: ${{ secrets.STUDYHARD_SIGNING_PASSWORD }}
        run: |
          printf '%s' "$PW" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --output "$RUNNER_TEMP/studyhard-release.jks" --decrypt native/android/studyhard-release.jks.gpg

      - name: Build the signed APK
        working-directory: android
        env:
          STUDYHARD_KEYSTORE: ${{ runner.temp }}/studyhard-release.jks
          STUDYHARD_KEYSTORE_PASSWORD: ${{ secrets.STUDYHARD_SIGNING_PASSWORD }}
          STUDYHARD_KEY_ALIAS: studyhard
          STUDYHARD_KEY_PASSWORD: ${{ secrets.STUDYHARD_SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../ci.log

      - name: Verify the signature
        run: |
          rm -f "$RUNNER_TEMP/studyhard-release.jks"
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -qi "certificate SHA-256 digest: $CERT_SHA256" signature.txt || { echo "::error::APK is not signed with the Study Hard release key"; exit 1; }
          cp "$APK" StudyHard.apk
          ls -l StudyHard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: StudyHard.apk
          retention-days: 14

      - name: Share the build log if something failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-results && tail -n 400 ci.log > ci-results/build-log.txt 2>/dev/null || true
          bash scripts/push-ci-results.sh "Build ${{ github.run_number }} failed"

  # The emulator test is optional (it can take 15–30 minutes on shared runners): run it from
  # Actions → Build APK → Run workflow with "smoke" ticked. Releases no longer wait for it.
  smoke:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and set up on an Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke-android.sh StudyHard.apk ci-results

      - name: Share screenshots and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/push-ci-results.sh "Smoke test for build ${{ github.run_number }} (${{ job.status }})"

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          CODE=$GITHUB_RUN_NUMBER   # same version code as scripts/android.mjs
          TAG="v$V-build.$CODE"
          {
            echo "**Study Hard $V, build $CODE**"
            echo
            echo "$(git log -1 --pretty=%s)"
            echo
            echo "Install: download **StudyHard.apk** below on your phone and open it. Updates install over the old version and keep your progress."
          } > notes.md
          gh release create "$TAG" StudyHard.apk --title "Study Hard $V (build $CODE)" --notes-file notes.md --latest
